name: Build and Push Docker Image

on:
  push:
    tags:
      - '*/v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          IMAGE_NAME="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building ${IMAGE_NAME}:${VERSION}"

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "${{ steps.parse.outputs.image_name }}/Dockerfile" ]; then
            echo "Error: ${{ steps.parse.outputs.image_name }}/Dockerfile not found"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ steps.parse.outputs.image_name }}
          push: true
          tags: |
            biodancer/${{ steps.parse.outputs.image_name }}:${{ steps.parse.outputs.version }}
            biodancer/${{ steps.parse.outputs.image_name }}:latest
